# Open WebUI with Foundry Local
#
# This stack automatically handles Foundry's dynamic ports.
# Just run: docker compose up -d
#
# The foundry-proxy service auto-discovers Foundry's port and provides
# a stable endpoint for Open WebUI.

services:
  # Foundry Proxy - auto-discovers Foundry's dynamic port
  foundry-proxy:
    build:
      context: ./foundry-proxy
      dockerfile: Dockerfile
    container_name: foundry-proxy
    restart: unless-stopped
    ports:
      - "5999:8080"  # Exposed for debugging, not required
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Open WebUI - ChatGPT-like interface
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Connect to the foundry-proxy which handles dynamic ports
      OPENAI_API_BASE_URL: "http://foundry-proxy:8080/v1"
      OPENAI_API_KEY: "local-key"
      # Speech-to-text via Foundry (if whisper model loaded)
      # WHISPER_API_BASE_URL: "http://foundry-proxy:8080/v1"
      # WHISPER_API_KEY: "local-key"
    depends_on:
      - foundry-proxy
    volumes:
      - type: bind
        source: ${LOCALAPPDATA}/open-webui
        target: /app/backend/data
