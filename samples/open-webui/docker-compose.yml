# Open WebUI with Foundry Local
#
# Foundry port: Uses FOUNDRY_PORT env var (default: auto-detect)
# Set a fixed port with: $env:FOUNDRY_PORT = "51413"; docker compose up -d
#
# Just run: docker compose up -d

services:
  # Foundry Proxy - auto-discovers Foundry's port with optional fixed port preference
  foundry-proxy:
    build:
      context: ./foundry-proxy
      dockerfile: Dockerfile
    container_name: foundry-proxy
    restart: unless-stopped
    ports:
      - "5999:8080"  # Exposed for debugging, not required
    environment:
      # Optional: Set FOUNDRY_PORT to prefer a specific port (falls back to auto-detect)
      - FOUNDRY_PORT=${FOUNDRY_PORT:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Open WebUI - ChatGPT-like interface
  open-webui-foundry:
    container_name: open-webui-foundry
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Connect to the foundry-proxy which handles dynamic ports
      OPENAI_API_BASE_URL: "http://foundry-proxy:8080/v1"
      OPENAI_API_KEY: "local-key"
      # Speech-to-text via Foundry (if whisper model loaded)
      # WHISPER_API_BASE_URL: "http://foundry-proxy:8080/v1"
      # WHISPER_API_KEY: "local-key"
    depends_on:
      - foundry-proxy
    volumes:
      - type: bind
        source: ${LOCALAPPDATA}/open-webui
        target: /app/backend/data
