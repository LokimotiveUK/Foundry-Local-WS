services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: "http://host.docker.internal:52089/v1"
      OPENAI_API_KEY: "local-key"
      # Uncomment the next two lines if you also want local speech-to-text via Foundry Local
      # WHISPER_API_BASE_URL: "http://host.docker.internal:52089/v1"
      # WHISPER_API_KEY: "local-key"
    volumes:
      - type: bind
        source: ${LOCALAPPDATA}/open-webui
        target: /app/backend/data
