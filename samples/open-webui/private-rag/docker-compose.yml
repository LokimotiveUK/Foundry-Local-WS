# Private RAG Stack
# Full stack for local document search with healthcare/finance focus
#
# Services:
#   - qdrant:     Vector database (port 6333)
#   - rag-server: RAG API server (port 8000)
#   - rag-admin:  Document management UI (port 8501)
#
# IMPORTANT: Foundry Local uses dynamic ports. Run the proxy first:
#   python foundry-proxy.py
#
# Then start the stack:
#   docker compose up -d
#
# Access:
#   - RAG Admin UI: http://localhost:8501
#   - RAG API: http://localhost:8000
#   - Qdrant Dashboard: http://localhost:6333/dashboard

services:
  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # RAG API Server
  rag-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: rag-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/app/documents:ro
      - ./categories.json:/app/categories.json
      - embedding_cache:/app/.cache
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=private_docs
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      # Foundry endpoint is AUTO-DETECTED by probing ports
      # No fixed port needed - the server finds Foundry dynamically
      - FOUNDRY_MODEL=${FOUNDRY_MODEL:-qwen2.5-0.5b-instruct-generic-cpu:4}
      - DOCKER_CONTAINER=1
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Document Management UI
  rag-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: rag-admin
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./documents:/app/documents
      - ./categories.json:/app/categories.json
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RAG_SERVER=http://rag-server:8000
      - COLLECTION_NAME=private_docs
      - DOCUMENTS_DIR=/app/documents
      - CATEGORIES_FILE=/app/categories.json
    depends_on:
      - qdrant
      - rag-server

volumes:
  qdrant_storage:
    driver: local
  embedding_cache:
    driver: local
