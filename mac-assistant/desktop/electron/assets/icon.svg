<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF"/>
      <stop offset="100%" style="stop-color:#5856D6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Brain/AI Icon -->
  <g transform="translate(106, 96)">
    <!-- Main circle -->
    <circle cx="150" cy="160" r="120" stroke="white" stroke-width="20" fill="none"/>

    <!-- Neural connections -->
    <circle cx="150" cy="100" r="20" fill="white"/>
    <circle cx="90" cy="160" r="20" fill="white"/>
    <circle cx="210" cy="160" r="20" fill="white"/>
    <circle cx="110" cy="220" r="20" fill="white"/>
    <circle cx="190" cy="220" r="20" fill="white"/>
    <circle cx="150" cy="160" r="25" fill="white"/>

    <!-- Connecting lines -->
    <line x1="150" y1="100" x2="150" y2="135" stroke="white" stroke-width="8"/>
    <line x1="90" y1="160" x2="125" y2="160" stroke="white" stroke-width="8"/>
    <line x1="175" y1="160" x2="210" y2="160" stroke="white" stroke-width="8"/>
    <line x1="110" y1="220" x2="135" y2="180" stroke="white" stroke-width="8"/>
    <line x1="165" y1="180" x2="190" y2="220" stroke="white" stroke-width="8"/>
  </g>

  <!-- Chat bubble accent -->
  <path d="M380 350 L420 390 L380 380 L340 390 Z" fill="white" opacity="0.9"/>
</svg>
