<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://localhost:* ws://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Quick Prompt</title>
  <style>
    :root {
      --bg-primary: rgba(255, 255, 255, 0.95);
      --bg-secondary: #f5f5f7;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --border-color: rgba(0, 0, 0, 0.1);
      --accent-color: #007aff;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    [data-theme="dark"] {
      --bg-primary: rgba(28, 28, 30, 0.95);
      --bg-secondary: #2c2c2e;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      background: var(--bg-primary);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 400px;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      -webkit-app-region: drag;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-color), #5856d6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg {
      width: 18px;
      height: 18px;
      color: white;
    }

    .header-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .close-btn {
      -webkit-app-region: no-drag;
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .close-btn:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .input-area {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    textarea {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--text-primary);
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      min-height: 48px;
      max-height: 100px;
    }

    textarea::placeholder {
      color: var(--text-secondary);
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: var(--accent-color);
      border-radius: 12px;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: #0062cc;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .response-area {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .response-placeholder {
      color: var(--text-secondary);
      font-size: 13px;
      text-align: center;
      padding: 40px 20px;
    }

    .response-message {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg-secondary);
      padding: 12px 16px;
      border-radius: 12px;
      white-space: pre-wrap;
    }

    .response-message.streaming::after {
      content: '|';
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-hint {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .footer-hint kbd {
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
    }

    .open-main-btn {
      font-size: 12px;
      color: var(--accent-color);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .open-main-btn:hover {
      background: var(--bg-secondary);
    }

    .loading {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-color);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
          <path d="M12 6v6l4 2"/>
        </svg>
      </div>
      <span class="header-title">Quick Prompt</span>
      <button class="close-btn" id="closeBtn" title="Close (Esc)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="promptInput" placeholder="Ask anything..." rows="1" autofocus></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="response-area" id="responseArea">
      <div class="response-placeholder" id="placeholder">
        Type your question and press Enter
      </div>
    </div>

    <div class="footer">
      <span class="footer-hint"><kbd>Esc</kbd> to close &bull; <kbd>Enter</kbd> to send</span>
      <button class="open-main-btn" id="openMainBtn">Open in main window</button>
    </div>
  </div>

  <script>
    const API_PORT = 8000;
    const API_BASE = `http://localhost:${API_PORT}`;

    let isStreaming = false;
    let currentMessage = '';
    let currentResponse = '';

    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const responseArea = document.getElementById('responseArea');
    const placeholder = document.getElementById('placeholder');
    const closeBtn = document.getElementById('closeBtn');
    const openMainBtn = document.getElementById('openMainBtn');

    // Auto-resize textarea
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 100) + 'px';
      sendBtn.disabled = !promptInput.value.trim();
    });

    // Handle Enter key
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (promptInput.value.trim()) {
          sendPrompt();
        }
      }
      if (e.key === 'Escape') {
        window.electronAPI?.hideQuickPrompt();
      }
    });

    // Send button
    sendBtn.addEventListener('click', () => {
      if (promptInput.value.trim()) {
        sendPrompt();
      }
    });

    // Close button
    closeBtn.addEventListener('click', () => {
      window.electronAPI?.hideQuickPrompt();
    });

    // Open in main window
    openMainBtn.addEventListener('click', () => {
      if (currentMessage && currentResponse) {
        window.electronAPI?.openInMainWindow(currentMessage, currentResponse);
      }
    });

    // Theme detection
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    });

    // Send prompt to API
    async function sendPrompt() {
      if (isStreaming) return;

      const message = promptInput.value.trim();
      if (!message) return;

      currentMessage = message;
      currentResponse = '';
      isStreaming = true;
      promptInput.value = '';
      promptInput.style.height = 'auto';
      sendBtn.disabled = true;

      // Show loading
      responseArea.innerHTML = `
        <div class="loading">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
      `;

      try {
        const response = await fetch(`${API_BASE}/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            max_tokens: 500,
            temperature: 0.7,
          }),
        });

        if (!response.ok) throw new Error('API error');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        responseArea.innerHTML = '<div class="response-message streaming" id="responseText"></div>';
        const responseText = document.getElementById('responseText');

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.token) {
                  currentResponse += data.token;
                  responseText.textContent = currentResponse;
                  responseArea.scrollTop = responseArea.scrollHeight;
                }
              } catch {}
            }
          }
        }

        responseText.classList.remove('streaming');
      } catch (error) {
        responseArea.innerHTML = `
          <div class="response-message" style="color: #ff3b30;">
            Failed to get response. Make sure the API is running.
          </div>
        `;
      }

      isStreaming = false;
    }

    // Focus input on show
    document.addEventListener('DOMContentLoaded', () => {
      promptInput.focus();
    });

    // Listen for theme changes from main process
    if (window.electronAPI) {
      window.electronAPI.onThemeChanged((theme) => {
        document.documentElement.setAttribute('data-theme', theme);
      });
    }
  </script>
</body>
</html>
